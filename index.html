<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemeriksaan Mekanik - Trio Motor Tamiang Layang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hondaRed: '#cc0000',
            hondaDarkRed: '#990000',
            hondaBlack: '#111111',
            statusBaik: '#16a34a',
            statusService: '#ca8a04',
            statusGanti: '#dc2626'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f4f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .status-btn-active-baik { background-color: #16a34a !important; color: white !important; border-color: #15803d !important; }
    .status-btn-active-service { background-color: #ca8a04 !important; color: white !important; border-color: #a16207 !important; }
    .status-btn-active-ganti { background-color: #dc2626 !important; color: white !important; border-color: #b91c1c !important; }
    
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-fast { animation: pulse-fast 0.8s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- FULLSCREEN HIGH-PRIORITY ALERT MODAL FOR MECHANIC -->
  <div id="fullScreenAlertModal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-hondaRed space-y-4 animate-pulse-fast">
      <div id="modalIconBg" class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
        <i id="modalIcon" class="fa-solid fa-bell-concierge"></i>
      </div>
      <div>
        <span id="modalBadge" class="bg-emerald-600 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider">
          PERSETUJUAN KONSUMEN
        </span>
        <h2 id="modalTitle" class="text-xl font-black text-gray-900 mt-2">Persetujuan Masuk!</h2>
        <p id="modalMessage" class="text-xs text-gray-600 mt-1">
          Konsumen MENSETUJUI perbaikan pada item: <strong>Oli Mesin</strong>.
        </p>
      </div>
      <button type="button" onclick="closeAlertModal()" class="w-full bg-hondaRed hover:bg-hondaDarkRed text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg text-sm flex items-center justify-center space-x-2">
        <i class="fa-solid fa-check-circle"></i>
        <span>Tutup & Cek Daftar Item</span>
      </button>
    </div>
  </div>

  <header class="bg-hondaBlack text-white sticky top-0 z-50 border-b-4 border-hondaRed shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-hondaRed p-2 rounded-lg flex items-center justify-center font-bold text-lg text-white">
          <i class="fa-solid fa-wrench"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-wide leading-tight">HONDA TRIO MOTOR</h1>
          <p class="text-xs text-gray-400">Form Lapor Hasil Cek Mekanik</p>
        </div>
      </div>
      <span class="text-[10px] bg-red-950 text-red-300 font-bold px-2.5 py-1 rounded-full border border-red-800 flex items-center">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-1.5"></span>Live Sync
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- DATA KENDARAAN -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 space-y-3">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center">
        <i class="fa-solid fa-id-card text-hondaRed mr-2"></i> Data Kendaraan & Konsumen
      </h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">No. Plat Motor</label>
          <input type="text" id="noPlat" placeholder="Contoh: DA1234ABC" onkeyup="startListeningConsumen()" onchange="startListeningConsumen()" class="w-full bg-slate-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-bold uppercase focus:outline-none focus:border-hondaRed">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Nama Konsumen</label>
          <input type="text" id="namaKonsumen" placeholder="Nama Pemilik" class="w-full bg-slate-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-hondaRed">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Tipe Motor</label>
          <select id="tipeMotor" class="w-full bg-slate-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-hondaRed">
            <option value="ADV 160">ADV 160</option>
            <option value="BeAT">BeAT</option>
            <option value="BeAT Street">BeAT Street</option>
            <option value="CB 150 R">CB 150 R</option>
            <option value="CB Verza">CB Verza</option>
            <option value="CB150X">CB150X</option>
            <option value="CBR 150 RR">CBR 150 RR</option>
            <option value="CRF 150">CRF 150</option>
            <option value="Genio">Genio</option>
            <option value="PCX">PCX</option>
            <option value="Revo">Revo</option>
            <option value="Scoopy">Scoopy</option>
            <option value="Stylo">Stylo</option>
            <option value="Supra">Supra</option>
            <option value="Supra GTR">Supra GTR</option>
            <option value="Vario">Vario</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">KM Terakhir</label>
          <input type="number" id="kmMotor" placeholder="Contoh: 12000" class="w-full bg-slate-50 border border-gray-300 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-hondaRed">
        </div>
      </div>
    </div>

    <!-- REKAP STATUS -->
    <div class="bg-gray-900 text-white p-3.5 rounded-2xl shadow-sm flex items-center justify-between text-xs">
      <div class="flex space-x-3">
        <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Baik: <span id="rekapBaik">15</span></span>
        <span class="text-amber-400 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Service: <span id="rekapService">0</span></span>
        <span class="text-rose-400 font-bold"><i class="fa-solid fa-circle-xmark mr-1"></i>Ganti: <span id="rekapGanti">0</span></span>
      </div>
      <span class="text-[10px] text-gray-400">Total: 15 Item</span>
    </div>

    <!-- 15 ITEM PEMERIKSAAN -->
    <div class="space-y-3" id="itemsContainer"></div>

    <!-- CATATAN MEKANIK -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
        <i class="fa-solid fa-comment-dots text-hondaRed mr-1"></i> Catatan Tambahan Mekanik:
      </label>
      <textarea id="catatanMekanik" rows="2" placeholder="Tulis pesan tambahan untuk konsumen di ruang tunggu..." class="w-full bg-slate-50 border border-gray-300 rounded-xl p-2.5 text-xs focus:outline-none focus:border-hondaRed"></textarea>
    </div>

    <!-- TOMBOL SIMPAN -->
    <button type="button" onclick="kirimKeFirebase()" id="btnSubmit" class="w-full bg-hondaRed hover:bg-hondaDarkRed text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
      <i class="fa-solid fa-paper-plane"></i>
      <span>Kirim Hasil Cek ke Konsumen Realtime</span>
    </button>

  </main>

  <script>
    const FIREBASE_BASE_URL = "https://supernova-6d8ed-default-rtdb.firebaseio.com/active_services/";

    const items = [
      { id: 1, name: "Lampu", icon: "fa-lightbulb" },
      { id: 2, name: "Minyak Rem", icon: "fa-flask" },
      { id: 3, name: "Oli Mesin", icon: "fa-oil-can" },
      { id: 4, name: "Oli Gardan", icon: "fa-gears" },
      { id: 5, name: "Ban Depan", icon: "fa-circle-notch" },
      { id: 6, name: "Ban Belakang", icon: "fa-circle-notch" },
      { id: 7, name: "Seal Shock", icon: "fa-ring" },
      { id: 8, name: "Kampas Rem", icon: "fa-shield-halved" },
      { id: 9, name: "Drive Belt (CVT)", icon: "fa-infinity" },
      { id: 10, name: "Gear & Rantai", icon: "fa-link" },
      { id: 11, name: "Air Radiator", icon: "fa-temperature-half" },
      { id: 12, name: "Bearing (Lahar)", icon: "fa-compact-disc" },
      { id: 13, name: "Filter Udara", icon: "fa-wind" },
      { id: 14, name: "Accu / Aki", icon: "fa-car-battery" },
      { id: 15, name: "Busi", icon: "fa-bolt" }
    ];

    const inspectionData = {};
    const consumerDecisions = {};
    let activeEventSource = null;
    let currentListeningPlat = "";

    items.forEach(item => {
      inspectionData[item.id] = { status: 'BAIK', note: '' };
    });

    function renderForm() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      items.forEach(item => {
        const curData = inspectionData[item.id];
        const decision = consumerDecisions[item.id];

        const card = document.createElement('div');
        card.id = `itemCard_${item.id}`;
        card.className = "bg-white rounded-2xl p-3.5 shadow-sm border border-gray-200 space-y-2.5 transition";
        
        let decisionBadge = '';
        if (decision === 'SETUJU') {
          decisionBadge = `<span class="bg-emerald-100 text-emerald-800 border border-emerald-300 text-[10px] font-black px-2 py-0.5 rounded-full flex items-center"><i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i> DISETOJOUI KONSUMEN</span>`;
        } else if (decision === 'ABAIKAN') {
          decisionBadge = `<span class="bg-gray-200 text-gray-700 border border-gray-300 text-[10px] font-black px-2 py-0.5 rounded-full flex items-center"><i class="fa-solid fa-circle-xmark mr-1 text-gray-500"></i> DIABAIKAN KONSUMEN</span>`;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded-lg bg-red-50 text-hondaRed flex items-center justify-center font-bold text-xs">
                <i class="fa-solid ${item.icon}"></i>
              </div>
              <span class="text-xs font-bold text-gray-800">${item.id}. ${item.name}</span>
            </div>
            <div class="flex space-x-1">
              <button type="button" onclick="setStatus(${item.id}, 'BAIK')" class="px-2.5 py-1 text-[10px] font-extrabold rounded-lg border border-gray-200 bg-gray-100 text-gray-600 ${curData.status === 'BAIK' ? 'status-btn-active-baik' : ''}">BAIK</button>
              <button type="button" onclick="setStatus(${item.id}, 'SERVICE')" class="px-2.5 py-1 text-[10px] font-extrabold rounded-lg border border-gray-200 bg-gray-100 text-gray-600 ${curData.status === 'SERVICE' ? 'status-btn-active-service' : ''}">SERVICE</button>
              <button type="button" onclick="setStatus(${item.id}, 'GANTI')" class="px-2.5 py-1 text-[10px] font-extrabold rounded-lg border border-gray-200 bg-gray-100 text-gray-600 ${curData.status === 'GANTI' ? 'status-btn-active-ganti' : ''}">GANTI</button>
            </div>
          </div>
          <div class="flex items-center justify-between space-x-2">
            <input type="text" placeholder="Catatan kondisi item ini..." value="${curData.note}" onchange="setNote(${item.id}, this.value)" class="flex-1 bg-slate-50 border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs text-gray-700 focus:outline-none focus:border-hondaRed">
            ${decisionBadge}
          </div>
        `;
        container.appendChild(card);
      });

      updateRekap();
    }

    function setStatus(id, st) {
      inspectionData[id].status = st;
      renderForm();
    }

    function setNote(id, val) {
      inspectionData[id].note = val;
    }

    function updateRekap() {
      let b = 0, s = 0, g = 0;
      Object.values(inspectionData).forEach(d => {
        if (d.status === 'BAIK') b++;
        if (d.status === 'SERVICE') s++;
        if (d.status === 'GANTI') g++;
      });
      document.getElementById('rekapBaik').innerText = b;
      document.getElementById('rekapService').innerText = s;
      document.getElementById('rekapGanti').innerText = g;
    }

    function startListeningConsumen() {
      const plat = document.getElementById('noPlat').value.trim().toUpperCase().replace(/\s+/g, '');
      if (!plat || plat === currentListeningPlat) return;

      currentListeningPlat = plat;
      if (activeEventSource) activeEventSource.close();

      const url = `${FIREBASE_BASE_URL}${plat}/decisions.json`;
      activeEventSource = new EventSource(url);

      activeEventSource.addEventListener('put', function(e) {
        const res = JSON.parse(e.data);
        if (res && res.data) {
          if (typeof res.data === 'object') {
            Object.keys(res.data).forEach(itemId => {
              const dec = res.data[itemId];
              if (consumerDecisions[itemId] !== dec) {
                consumerDecisions[itemId] = dec;
                triggerMechanicAlert(itemId, dec);
              }
            });
          } else if (typeof res.data === 'string' && res.path) {
            const itemId = res.path.replace('/', '');
            const dec = res.data;
            if (itemId && consumerDecisions[itemId] !== dec) {
              consumerDecisions[itemId] = dec;
              triggerMechanicAlert(itemId, dec);
            }
          }
          renderForm();
        }
      });
    }

    function triggerMechanicAlert(itemId, decision) {
      const itemObj = items.find(i => i.id == itemId);
      const itemName = itemObj ? itemObj.name : `Item #${itemId}`;

      playAlertSound();

      const modal = document.getElementById('fullScreenAlertModal');
      const iconBg = document.getElementById('modalIconBg');
      const icon = document.getElementById('modalIcon');
      const badge = document.getElementById('modalBadge');
      const title = document.getElementById('modalTitle');
      const msg = document.getElementById('modalMessage');

      if (decision === 'SETUJU') {
        iconBg.className = "w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner";
        icon.className = "fa-solid fa-circle-check";
        badge.className = "bg-emerald-600 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider";
        badge.innerText = "PERSETUJUAN KONSUMEN";
        title.innerText = "Perbaikan Disetujui!";
        msg.innerHTML = `Konsumen <strong class="text-emerald-700 font-bold uppercase">MENSETUJUI</strong> perbaikan/pergantian pada item: <br><span class="text-base font-black text-gray-900">${itemId}. ${itemName}</span>`;
      } else if (decision === 'ABAIKAN') {
        iconBg.className = "w-20 h-20 bg-gray-100 text-gray-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner";
        icon.className = "fa-solid fa-circle-xmark";
        badge.className = "bg-gray-700 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider";
        badge.innerText = "DIABAIKAN KONSUMEN";
        title.innerText = "Persetujuan Ditolak";
        msg.innerHTML = `Konsumen <strong class="text-gray-700 font-bold uppercase">DIABAIKAN</strong> saran perbaikan pada item: <br><span class="text-base font-black text-gray-900">${itemId}. ${itemName}</span>`;
      }

      modal.classList.remove('hidden');
    }

    function closeAlertModal() {
      document.getElementById('fullScreenAlertModal').classList.add('hidden');
    }

    function playAlertSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); // G5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {
        console.log('Audio Error:', e);
      }
    }

    function kirimKeFirebase() {
      const plat = document.getElementById('noPlat').value.trim().toUpperCase().replace(/\s+/g, '');
      const nama = document.getElementById('namaKonsumen').value.trim();
      const tipe = document.getElementById('tipeMotor').value;
      const km = document.getElementById('kmMotor').value;
      const catatan = document.getElementById('catatanMekanik').value.trim();

      if (!plat) {
        Swal.fire("Nomor Plat Kosong", "Harap isi Nomor Plat Motor terlebih dahulu!", "warning");
        return;
      }

      const payload = {
        platNo: document.getElementById('noPlat').value.toUpperCase(),
        namaKonsumen: nama || "Konsumen",
        tipeMotor: tipe,
        kmMotor: km || "0",
        catatanMekanik: catatan,
        lastUpdate: new Date().toLocaleTimeString('id-ID'),
        items: inspectionData
      };

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengirim Data...`;

      fetch(`${FIREBASE_BASE_URL}${plat}.json`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Hasil Cek ke Konsumen Realtime`;
        Swal.fire("Berhasil Dikirim!", `Laporan motor ${payload.platNo} terkirim ke HP konsumen!`, "success");
        startListeningConsumen();
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Hasil Cek ke Konsumen Realtime`;
        Swal.fire("Gagal Terkirim", err.message, "error");
      });
    }

    renderForm();
  </script>
</body>
</html>
